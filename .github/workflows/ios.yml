name: iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor iOS project
        run: npx cap sync ios

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodebuild -list -project ios/App/App.xcodeproj

      - name: Build app (unsigned)
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          APP="build/DerivedData/Build/Products/Release-iphoneos/App.app"
          if [ ! -d "$APP" ]; then
            echo "::error::App.app not found at $APP"
            exit 1
          fi
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          cd build
          zip -qry Aura-1.0.0-unsigned.ipa Payload
          shasum -a 256 Aura-1.0.0-unsigned.ipa | tee Aura-1.0.0-unsigned.ipa.sha256

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: aura-ios-ipa
          path: build/Aura-1.0.0-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        run: |
          {
            echo "## Aura — iPhone"
            echo ""
            echo "IPA non signé : \`Aura-1.0.0-unsigned.ipa\`"
            echo ""
            echo "Téléchargez-le dans les artifacts de ce run, puis signez-le avec Sideloadly ou AltStore (identifiant Apple gratuit) pour l'installer sur un iPhone."
            echo ""
            echo '```'
            cat build/Aura-1.0.0-unsigned.ipa.sha256
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
